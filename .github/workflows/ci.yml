name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      TEST_DB_URL: jdbc:tc:postgresql:16:///sgo

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y verificar
        run: ./mvnw -B verify

      - name: Subir reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: target/surefire-reports/
