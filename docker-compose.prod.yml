services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - sgo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      SGO_ADMIN_PASSWORD: ${SGO_ADMIN_PASSWORD}
      SGO_CORREO_REMITENTE: ${SGO_CORREO_REMITENTE}
      SGO_ALMACEN_RAIZ: /data/almacen
      SGO_DIRECCION_NOMBRE: ${SGO_DIRECCION_NOMBRE:-Dirección del Hospital General}
    volumes:
      - sgo-almacen:/data/almacen
      - sgo-logs:/app/logs

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SGO_DOMINIO: ${SGO_DOMINIO:-localhost}
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - sgo-caddy-data:/data
      - sgo-caddy-config:/config

volumes:
  sgo-pgdata:
  sgo-almacen:
  sgo-logs:
  sgo-caddy-data:
  sgo-caddy-config:
