<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<body style="font-family: Arial, sans-serif; color: #333;">

<p>Se le ha turnado el siguiente oficio para su atención:</p>
<table style="border-collapse: collapse; margin: 16px 0;">
    <tr>
        <td style="padding: 4px 12px; font-weight: bold;">Folio:</td>
        <td style="padding: 4px 12px;" th:text="${oficio.folio}"></td>
    </tr>
    <tr>
        <td style="padding: 4px 12px; font-weight: bold;">Fecha:</td>
        <td style="padding: 4px 12px;" th:text="${oficio.fecha}"></td>

    <tr>
        <td style="padding: 4px 12px; font-weight: bold;">Remitente:</td>
        <td style="padding: 4px 12px;" th:text="${oficio.remitente}"></td>
    </tr>
    <tr>
        <td style="padding: 4px 12px; font-weight: bold;">Asunto:</td>
        <td style="padding: 4px 12px;" th:text="${oficio.asunto}"></td>
    </tr>
</table>
<p>Favor de revisar el documento adjunto.</p>
<hr style="border: none; border-top: 1px solid #ccc;">
<p style="font-size: 12px; color: #888;">Este correo fue generado automáticamente por el Sistema de Gestión de Oficios (SGO).</p>

</html>
