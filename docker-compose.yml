services:
  db:
    image: postgres:16
    container_name: sgo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sgo}
      POSTGRES_USER: ${POSTGRES_USER:-sgo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sgo_dev_2024}
    ports:
      - "5433:5432"
    volumes:
      - sgo-pgdata:/var/lib/postgresql/data

volumes:
  sgo-pgdata:
