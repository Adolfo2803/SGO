spring:
  profiles:
    active: dev

  application:
    name: sgo

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

---
# Perfil de desarrollo
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB:sgo}
    username: ${POSTGRES_USER:sgo}
    password: ${POSTGRES_PASSWORD:sgo_dev_2024}

  mail:
    host: localhost
    port: 1025

  security:
    user:
      name: admin
      password: admin

---
# Perfil de pruebas
spring:
  config:
    activate:
      on-profile: test

  mail:
    host: localhost
    port: 1025

  security:
    user:
      name: admin
      password: admin

---
# Perfil de produccion
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
